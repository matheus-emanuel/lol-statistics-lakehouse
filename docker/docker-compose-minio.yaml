services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ../configs/minio.env
    volumes:
      - ../lakehouse:/lakehouse
    command: server --console-address ":9001" /lakehouse
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/check"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - lol-statistics-lakehouse
      
networks:
  lol-statistics-lakehouse:
    name: lol-statistics-lakehouse  # Isso garante que a rede se chame exatamente assim
    driver: bridge
